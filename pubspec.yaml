name: nutri_app
description: App do consultório de nutrição - cardápio digital, receitas, diário alimentar com base na TACO e chat com a nutricionista.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.0
  flutter_timezone: ^5.1.1
  image_picker: ^1.2.4
  intl: ^0.19.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/taco.json

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#2E7D5B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21
