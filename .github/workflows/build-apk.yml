name: Gerar APK de teste

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise e testes
        run: |
          flutter analyze
          flutter test

      - name: Build do APK
        run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk nutri_app-teste.apk

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: nutri_app-apk
          path: nutri_app-teste.apk

      - name: Publicar na release "teste"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: teste
          name: APK de teste
          body: APK de teste gerado automaticamente a partir da branch main (commit ${{ github.sha }}).
          prerelease: true
          files: nutri_app-teste.apk
